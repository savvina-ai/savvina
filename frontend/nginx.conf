server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Behind a reverse proxy $remote_addr is the proxy's address, so every client
    # would share one backend rate-limit bucket and every login attempt would be
    # logged against the proxy. docker-entrypoint.sh replaces the placeholder
    # below with set_real_ip_from / real_ip_header directives built from
    # TRUSTED_LB_CIDR; with the variable unset the line renders empty.
    __REAL_IP_CONFIG__

    # X-Content-Type-Options, X-Frame-Options, Referrer-Policy, Cache-Control, and CSP for /api/
    # paths are all set by the FastAPI SecurityHeadersMiddleware — not duplicated here.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 'unsafe-inline' for style-src is required: Radix UI and Tailwind inject inline styles at
    # runtime. Nonce-based CSP is not feasible without SSR. Known limitation, documented here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; report-uri /api/csp-report" always;
    # No Strict-Transport-Security here: this container speaks plain HTTP. Put a
    # TLS-terminating reverse proxy in front for anything beyond local/LAN use and
    # set HSTS there (see docs/administration/deployment.md).

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Shared proxy settings for all /api/ locations.
    # nginx inherits proxy_set_header from this server block only when a
    # location block defines no proxy_set_header directives of its own —
    # so the location blocks below must not add any proxy_set_header lines.
    # X-Real-IP is $remote_addr *after* the real_ip rewrite above, so behind a trusted proxy it is the true client.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # No X-Forwarded-Proto: the backend decides the cookie Secure flag and HSTS
    # from its BEHIND_TLS_PROXY setting, not from a header that any client on a
    # plain-HTTP install could set (this block would have passed it through).
    # HTTP/1.1 is required for chunked transfer (SSE streaming)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    # LLM calls (semantic generation, chat) can take several minutes
    proxy_read_timeout    300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    # Semantic model generation: fingerprints every column then calls an LLM —
    # easily 5-10 minutes for large schemas (100+ columns). Override timeout only
    # for this endpoint so other API routes keep the tighter 300s limit.
    location ~ ^/api/v1/connections/[^/]+/semantic/generate {
        proxy_pass http://backend:8000;
        proxy_read_timeout    900s;
        proxy_send_timeout    900s;
    }
}
