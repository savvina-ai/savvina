name: Dependency audit

# Shared by ci.yml (every push and PR) and release.yml (gate before a tag is
# cut), so a pin, flag, or waiver changed here changes both. Both audits read
# the committed manifests; neither needs the dependencies installed. ci.yml's
# frontend audit used to run `npm ci` first, which this does not: `npm audit`
# reads package-lock.json either way, and lockfile drift still fails the
# `npm ci` in frontend-lint and frontend-test.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit-python:
    name: Python dependency audit
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Python dependency audit
        run: pip install pip-audit==2.10.0 && pip-audit -r backend/requirements.txt

  audit-frontend:
    name: Frontend dependency audit
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `braces` <= 3.0.3 has an open high advisory (GHSA-vfj7-8cjw-p6xm) with no
      # patched release. It is reached only at build time through
      # tailwindcss 3 -> chokidar / fast-glob -> micromatch -> braces, where
      # Tailwind scans our own source files with patterns from our own config, so
      # no untrusted pattern ever reaches it. Those packages are allow-listed
      # below; any other high or critical finding still fails the step, and so
      # does an audit that errors out or returns unparseable output. Remove the
      # allow-list once braces ships a fix or Tailwind is on v4.
      - name: Frontend dependency audit
        run: |
          npm audit --audit-level=high --json > "$RUNNER_TEMP/audit.json" || true
          node - "$RUNNER_TEMP/audit.json" <<'EOF'
          const fs = require("fs");
          const allowed = new Set([
            "braces",
            "micromatch",
            "fast-glob",
            "chokidar",
            "tailwindcss",
            "tailwindcss-animate",
          ]);

          let report;
          try {
            report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          } catch (err) {
            console.error(`npm audit produced no parseable JSON: ${err.message}`);
            process.exit(1);
          }
          if (report.error || !report.vulnerabilities) {
            console.error("npm audit failed:", JSON.stringify(report.error ?? report));
            process.exit(1);
          }

          const blocking = Object.entries(report.vulnerabilities)
            .filter(([, v]) => ["high", "critical"].includes(v.severity))
            .map(([name]) => name);
          const offending = blocking.filter((name) => !allowed.has(name));
          if (offending.length > 0) {
            console.error(`High/critical vulnerabilities outside the allow-list: ${offending.join(", ")}`);
            process.exit(1);
          }
          console.log(`Allow-listed high findings only: ${blocking.join(", ") || "none"}`);
          EOF
        working-directory: frontend
