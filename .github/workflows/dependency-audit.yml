name: Dependency audit

# Shared by ci.yml (every push and PR) and release.yml (gate before a tag is
# cut), so a pin, flag, or waiver changed here changes both. Both audits read
# the committed manifests; neither needs the dependencies installed. ci.yml's
# frontend audit used to run `npm ci` first, which this does not: `npm audit`
# reads package-lock.json either way, and lockfile drift still fails the
# `npm ci` in frontend-lint and frontend-test.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit-python:
    name: Python dependency audit
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Python dependency audit
        run: pip install pip-audit==2.10.0 && pip-audit -r backend/requirements.txt

  audit-frontend:
    name: Frontend dependency audit
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependency audit
        run: npm audit --audit-level=high
        working-directory: frontend
