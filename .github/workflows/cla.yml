name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla_assistant:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Check
        uses: actions/github-script@v7
        with:
          script: |
            const CLA_BRANCH = 'cla-signatures';
            const SIGNATURES_PATH = 'signatures/cla.json';
            const CLA_DOCUMENT_URL = 'https://github.com/savvina-ai/savvina/blob/main/CLA.md';
            const SIGN_PHRASE = 'I have read the CLA Document and I hereby sign the CLA';
            const ALLOWLIST = ['saltsift-delivery-bot'];
            const ALLOWLIST_PREFIXES = ['bot'];

            function isAllowlisted(login) {
              if (ALLOWLIST.includes(login)) return true;
              return ALLOWLIST_PREFIXES.some(p => login.toLowerCase().startsWith(p));
            }

            async function readSignatures() {
              try {
                const resp = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: SIGNATURES_PATH,
                  ref: CLA_BRANCH,
                });
                const text = Buffer.from(resp.data.content, 'base64').toString('utf8');
                return { data: JSON.parse(text), sha: resp.data.sha };
              } catch {
                return { data: { signedContributors: [] }, sha: null };
              }
            }

            async function writeSignatures(signatures, sha) {
              const encoded = Buffer.from(JSON.stringify(signatures, null, 4)).toString('base64');
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: SIGNATURES_PATH,
                branch: CLA_BRANCH,
                message: `@${context.actor} has signed the CLA in #${prNumber}`,
                content: encoded,
                ...(sha ? { sha } : {}),
              });
            }

            async function postStatus(sha, state, description) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha,
                state,
                context: 'CLA Assistant',
                description: description.slice(0, 140),
                target_url: CLA_DOCUMENT_URL,
              });
            }

            async function getContributors(prNumber) {
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              const logins = new Set();
              for (const c of commits) {
                if (c.author?.login) logins.add(c.author.login);
              }
              return [...logins];
            }

            let prNumber, prHeadSha;

            if (context.eventName === 'pull_request_target') {
              if (context.payload.action === 'closed') return;
              prNumber = context.payload.pull_request.number;
              prHeadSha = context.payload.pull_request.head.sha;
            } else {
              // issue_comment — record the signature before checking
              prNumber = context.payload.issue.number;
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              prHeadSha = pr.data.head.sha;

              const { data: currentSigs, sha: fileSha } = await readSignatures();
              if (!currentSigs.signedContributors.some(s => s.name === context.actor)) {
                const user = await github.rest.users.getByUsername({ username: context.actor });
                currentSigs.signedContributors.push({
                  name: context.actor,
                  id: user.data.id,
                  comment_id: context.payload.comment.id,
                  created_at: new Date().toISOString(),
                  repoId: context.payload.repository.id,
                  pullRequestNo: prNumber,
                });
                await writeSignatures(currentSigs, fileSha);
              }
            }

            // Determine who still needs to sign
            const contributors = await getContributors(prNumber);
            const { data: latestSigs } = await readSignatures();
            const signed = new Set(latestSigs.signedContributors.map(s => s.name));
            const unsigned = contributors.filter(l => !isAllowlisted(l) && !signed.has(l));

            if (unsigned.length === 0) {
              core.info('All contributors have signed the CLA ✅');
              await postStatus(prHeadSha, 'success', 'All contributors have signed the CLA.');
            } else {
              core.info(`Waiting for CLA signature from: ${unsigned.join(', ')}`);
              await postStatus(prHeadSha, 'failure', `CLA not signed by: ${unsigned.join(', ')}`);

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });
              const alreadyCommented = comments.some(
                c => c.user.type === 'Bot' && c.body.includes('Contributor License Agreement')
              );
              if (!alreadyCommented) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: `## Contributor License Agreement\n\nHi @${unsigned.join(', @')}! Before we can merge this contribution, please sign our [Contributor License Agreement](${CLA_DOCUMENT_URL}).\n\nTo sign, reply with:\n\n> ${SIGN_PHRASE}`,
                });
              }
            }
